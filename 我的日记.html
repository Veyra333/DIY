<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的日记</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
<script defer src="https://fastly.jsdelivr.net/npm/lunar-javascript@1.6.7/lunar.js"></script>
<style>
:root{
  --accent:#4C93E0; --soft:#EAF3FD; --page:#F1F7FD;
  --c1:#A8CFF1; --c2:#E8F3FD;
  --ink:#20262E; --body:#333B45; --sub:#9BA6B3; --line:#EEF1F5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center; min-height:100vh;
}
.app{width:100%;max-width:440px;background:#fff;position:relative;min-height:100vh;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(40,70,110,.07)}

/* ===== 顶部导航 ===== */
.nav{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.nav h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.06em}
.nav-ico{
  width:34px;height:34px;border-radius:50%;border:0;background:none;
  display:flex;align-items:center;justify-content:center;
  color:#8C99A8;cursor:pointer;
}
.nav-ico svg{width:19px;height:19px}
.searchbar{overflow:hidden;max-height:0;transition:max-height .25s ease;background:#fff;border-bottom:1px solid transparent}
.searchbar.on{max-height:58px;border-bottom-color:var(--line)}
.searchbar input{width:100%;border:0;outline:0;padding:11px 18px;font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff}
.searchbar input::placeholder{color:#BFC9D5}

/* ===== 视图 ===== */
.view{display:none;flex:1;padding-bottom:110px}
.view.on{display:block}

/* ===== 时间线 ===== */
.tl-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 22px 12px}
.tl-head h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.1em;color:#55606D}
.tl-head span{font-size:11.5px;color:#B2BCC8}
.tl{display:flex;flex-direction:column;gap:14px;padding:0 18px}
.tl-card{background:#fff;border:1px solid #EDF1F6;border-radius:18px;padding:16px 18px 14px;box-shadow:0 3px 14px rgba(50,85,130,.05)}
.tl-head-row{display:flex;align-items:flex-start;justify-content:space-between}
.tl-date-line{display:flex;align-items:baseline;gap:8px}
.tl-day{font-size:25px;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.tl-wk{font-size:12.5px;font-weight:500;color:#8C99A8}
.tl-time{font-size:11.5px;color:#AEB9C6;margin-top:5px;letter-spacing:.02em}
.tl-right{display:flex;align-items:flex-start;gap:8px}
.tl-author{text-align:right}
.tl-name{font-size:12.5px;font-weight:800;color:#404A57}
.tl-vis{font-size:10.5px;color:#B4BFCC;margin-top:2px;font-weight:400}
.tl-av{
  width:30px;height:30px;border-radius:50%;flex:none;background:var(--soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  background-size:cover;background-position:center;
}
.tl-body{margin:12px 0 0;font-size:16px;font-weight:600;line-height:1.95;color:var(--body);white-space:pre-wrap;word-break:break-word;letter-spacing:.01em}
.tl-imgs{display:grid;gap:7px;margin-top:11px}
.tl-imgs.one{grid-template-columns:1fr}
.tl-imgs.one .tl-img{aspect-ratio:4/3}
.tl-imgs.two{grid-template-columns:1fr 1fr}
.tl-imgs.many{grid-template-columns:1fr 1fr}
.tl-img{aspect-ratio:1.15;border-radius:12px;background-color:#F3F7FB;background-size:cover;background-position:center;cursor:pointer}
.tl-meta{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:2px;font-size:12px;color:#A5B1BF;min-height:16px}
.tl-meta .loc{display:flex;align-items:center;gap:4px}
.tl-meta svg{width:13px;height:13px}
.stars{display:flex;gap:3px;margin-top:10px}
.stars b{font-size:15px;line-height:1;color:#E4E9EF;transition:.15s;cursor:pointer}
.stars b.on{color:#F2B33D}
.tl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.tl-acts{display:flex;align-items:center;gap:14px}
.ibtn2{border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;font-size:13px;color:#A4B0BE;transition:.15s}
.ibtn2 svg{width:19px;height:19px}
.ibtn2.liked{color:#F06A7A}
.ibtn2.liked svg{fill:#F06A7A;stroke:#F06A7A}
.mini-acts{display:flex;gap:8px}
.mini{border:1px solid #EEF2F7;background:#F9FBFD;color:#96A3B2;font-family:inherit;font-size:11.5px;padding:4px 11px;border-radius:8px;cursor:pointer}
.mini:active{background:#F1F6FB}

/* ===== 日历 ===== */
.cal-head{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 0 10px}
.cal-title{font-size:19px;font-weight:900;letter-spacing:.02em;min-width:120px;text-align:center}
.cal-nav{width:30px;height:30px;border-radius:50%;border:0;background:none;color:#A9B4C1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav svg{width:16px;height:16px}
.cal-nav:active{background:#F3F7FB}
.cal-today{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  border:1px solid #DFE9F5;background:#fff;color:#7C93A9;
  font-family:inherit;font-size:11.5px;font-weight:500;
  width:26px;height:26px;border-radius:50%;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
}
.cal-today:active{background:var(--soft);color:var(--accent)}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 16px;margin-bottom:4px}
.cal-week span{text-align:center;font-size:11.5px;color:#AEB9C6}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 16px;gap:2px}
.cal-cell{min-width:0;height:70px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:.15s;overflow:hidden}
.cal-cell.empty{cursor:default}
.cal-cell:active:not(.empty){background:#F4F8FC}
.cal-num{font-size:16.5px;font-weight:800;color:#3D4753;line-height:1.2}
.cal-lunar{font-size:10px;color:#B4BFCC;margin-top:2px;line-height:1.2}
.cal-cell.has .cal-num{color:var(--accent)}
.cal-cell.has .cal-lunar{color:rgba(76,147,224,.5)}
.cal-thumb{width:24px;height:24px;border-radius:6px;margin-top:2px;background-size:cover;background-position:center;background-color:var(--soft)}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:3px}
.cal-cell.today{box-shadow:inset 0 0 0 1px rgba(76,147,224,.4)}
.cal-sum{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;font-size:12px;color:#A9B4C1}
.cal-sum b{color:#5C6673;font-weight:700}
.cal-sum i{font-style:normal;color:#DDE4EC}

/* ===== 我的 ===== */
.cover{position:relative;height:186px;background:linear-gradient(155deg,var(--c1),var(--c2));background-size:cover;background-position:center}
.cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,30,45,.24) 0%,rgba(255,255,255,0) 48%,rgba(255,255,255,.6) 100%)}
.cover-bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 14px}
.round-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.round-btn svg{width:16px;height:16px}
.avatar-wrap{margin-top:-52px;display:flex;justify-content:center;position:relative;z-index:3}
.avatar{width:104px;height:104px;border-radius:50%;border:4px solid #fff;background:var(--soft);box-shadow:0 6px 18px rgba(45,75,110,.14);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--accent);cursor:pointer;overflow:hidden}
.profile{text-align:center;padding:10px 22px 0}
.name{margin:2px 0 0;font-size:23px;font-weight:900;line-height:1.35}
.handle{margin:4px 0 0;font-size:12px;color:#A8B4C1;letter-spacing:.06em}
.bio{margin:11px 6px 0;font-size:12.5px;line-height:1.8;color:#8E9AA8}
.actions{display:flex;gap:8px;padding:16px 20px 0}
.act{flex:1;border:1px solid #EBEFF4;background:#fff;color:#5C6673;font-family:inherit;font-size:12.5px;font-weight:500;padding:9px 0;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.act svg{width:13px;height:13px;opacity:.7}
.act:active{background:#F7F9FC}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.act.primary svg{opacity:1}
.stats{display:flex;justify-content:center;padding:16px 20px 14px}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:16px;font-weight:700;color:var(--accent);line-height:1.4}
.stat span{font-size:11px;color:#A9B4C1;letter-spacing:.04em}
.profile-links{padding:0 18px}
.link-row{display:flex;align-items:center;gap:10px;padding:14px 6px;border-top:1px solid var(--line);font-size:13.5px;color:#4A5462;cursor:pointer}
.link-row .li{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.link-row .li svg{width:14px;height:14px}
.link-row span.sub{flex:1}
.link-row .arrow{color:#CBD5E0;font-size:14px}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:56px 30px;color:#AFBAC7}
.empty svg{width:44px;height:44px;opacity:.55;margin-bottom:12px}
.empty p{margin:0;font-size:12.5px;line-height:1.9}

/* ===== 底栏 ===== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:26;
  display:flex;padding:7px 0 calc(6px + env(safe-area-inset-bottom));
}
.tab{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;font-size:10.5px;color:#A7B2BF;letter-spacing:.04em}
.tab svg{width:20px;height:20px}
.tab.on{color:var(--accent);font-weight:500}
.fab{
  position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));
  right:max(18px, calc(50% - 202px));
  width:50px;height:50px;border-radius:50%;border:0;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:30;box-shadow:0 8px 20px rgba(76,147,224,.32);
}
.fab svg{width:21px;height:21px}

/* ===== 浮层 ===== */
.scrim{position:fixed;inset:0;background:rgba(30,40,52,.3);opacity:0;pointer-events:none;transition:.24s;z-index:40;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:440px;margin:0 auto;
  background:#fff;border-radius:22px 22px 0 0;transform:translateY(103%);
  transition:transform .3s cubic-bezier(.22,.8,.3,1);max-height:88vh;overflow-y:auto;
  padding:8px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(30,50,80,.12);
}
.sheet.on{transform:translateY(0)}
.bar{width:36px;height:4px;border-radius:2px;background:#E8EDF3;margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
.xbtn{border:0;background:none;font-family:inherit;font-size:12.5px;color:var(--sub);cursor:pointer;padding:0}
.field{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field label{width:52px;flex:none;font-size:12px;color:var(--sub);letter-spacing:.04em}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;color:var(--ink)}
.field input::placeholder{color:#C2CCD8}
.mood-row{display:flex;gap:7px;flex-wrap:wrap;padding:14px 0 2px}
.vis-row{display:flex;gap:8px;flex:1;padding-top:2px}
.chip{border:1px solid #EDF1F5;background:#fff;color:#9BA6B3;font-family:inherit;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--soft);border-color:rgba(76,147,224,.3);color:var(--accent);font-weight:500}
.sheet textarea{width:100%;min-height:132px;border:0;outline:0;resize:none;font-family:inherit;font-size:14.5px;font-weight:500;line-height:1.95;color:var(--body);padding:12px 0 6px;background:transparent}
.sheet textarea::placeholder{color:#C2CCD8;font-weight:400}
.img-area{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;background-color:#F3F7FB;background-size:cover;background-position:center}
.thumb .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(35,48,62,.75);color:#fff;font-size:12px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-add-row{display:flex;align-items:center;gap:9px;padding:10px 0 0}
.add-btn{border:1px dashed #D9E3EE;background:#fff;color:#95A5B6;font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:10px;cursor:pointer}
.img-hint{font-size:11px;color:#C0CBD7}
.sheet-foot{display:flex;gap:10px;padding-top:12px}
.btn-ghost{flex:1;border:1px solid #EDF1F5;background:#fff;color:var(--sub);font-family:inherit;font-size:13px;padding:11px;border-radius:12px;cursor:pointer}
.btn-main{flex:2;border:0;background:var(--accent);color:#fff;font-family:inherit;font-size:13.5px;font-weight:500;letter-spacing:.05em;padding:11px;border-radius:12px;cursor:pointer}

.themes{display:flex;gap:14px;justify-content:center;padding:10px 0 18px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2px}
.swatch span{width:26px;height:26px;border-radius:50%}
.theme-name{text-align:center;font-size:11px;color:var(--sub);letter-spacing:.06em;margin:-8px 0 10px}

.cm-quote{background:#F8FAFD;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.75;color:#7C8896;max-height:76px;overflow:hidden;margin-bottom:12px}
.cm-list{max-height:34vh;overflow-y:auto}
.cm-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #F4F6F9}
.cm-av{width:26px;height:26px;border-radius:50%;flex:none;background:var(--soft);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cm-main{flex:1;min-width:0}
.cm-meta{font-size:11px;color:#AEB9C6;margin-bottom:2px}
.cm-text{font-size:13px;line-height:1.7;color:var(--body);white-space:pre-wrap;word-break:break-word}
.cm-empty{text-align:center;font-size:12px;color:#B6C0CC;padding:24px 0}
.cm-input{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.cm-input input{flex:1;min-width:0;border:1px solid #EDF1F5;border-radius:999px;padding:10px 14px;font-family:inherit;font-size:13px;outline:0;color:var(--ink);background:#FAFCFE}
.cm-send{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:10px 16px;font-family:inherit;font-size:12.5px;cursor:pointer;flex:none}

.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,10px);background:rgba(31,41,54,.88);color:#fff;font-size:12px;padding:8px 16px;border-radius:999px;letter-spacing:.04em;opacity:0;pointer-events:none;transition:.22s;z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="app">

  <header class="nav">
    <button class="nav-ico" id="btnSwap" title="切换日历 / 时间线">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    </button>
    <h2 id="navTitle">时间线</h2>
    <button class="nav-ico" id="btnSearch" title="搜索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    </button>
  </header>
  <div class="searchbar" id="searchBar"><input id="searchInput" placeholder="搜索日记内容，或输入月份，如 11"></div>

  <!-- ===== 时间线 ===== -->
  <section class="view on" id="view-timeline">
    <div class="tl-head">
      <h3>全部日记</h3>
      <span id="tlCount">0 篇 · 0 字</span>
    </div>
    <div class="tl" id="timeline"></div>
    <div class="empty" id="tlEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
      <p>还没有日记<br>点右下角加号，写下今天第一句</p>
    </div>
  </section>

  <!-- ===== 日历 ===== -->
  <section class="view" id="view-calendar">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M14 5l-6 7 6 7"/></svg></button>
      <div class="cal-title" id="calTitle">2026年11月</div>
      <button class="cal-nav" id="calNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 5l6 7-6 7"/></svg></button>
      <button class="cal-today" id="calToday">今</button>
    </div>
    <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-sum" id="calSum"></div>
    <div class="tl" id="calDayList" style="margin-top:10px"></div>
  </section>

  <!-- ===== 我的 ===== -->
  <section class="view" id="view-profile">
    <div class="cover" id="cover">
      <div class="cover-shade"></div>
      <div class="cover-bar">
        <button class="round-btn" id="btnTheme" title="主题配色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3a9 9 0 0 1 0 18"/><circle cx="12" cy="6.4" r="1.3"/><circle cx="12" cy="17.6" r="1.3"/></svg>
        </button>
        <button class="round-btn" id="btnCover" title="更换封面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M4 18l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>
        </button>
      </div>
    </div>
    <div class="avatar-wrap"><div class="avatar" id="avatar" title="点击更换头像"></div></div>
    <div class="profile">
      <h1 class="name" id="pName">我的日记</h1>
      <p class="handle" id="pHandle">@mydiary</p>
      <p class="bio" id="pBio"></p>
    </div>
    <div class="actions">
      <button class="act" id="btnEditProfile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4-10 10z"/><path d="M14 6l4 4"/></svg>
        编辑资料

<script>
/* ================= 数据 ================= */
const KEY='idiary-v2';
const THEMES=[
  {id:'blue',  name:'晴空', accent:'#4C93E0', soft:'#EAF3FD', page:'#F1F7FD', c1:'#A8CFF1', c2:'#E8F3FD'},
  {id:'pink',  name:'晨曦', accent:'#E38FA6', soft:'#FDECF1', page:'#FDF5F7', c1:'#F4C8D5', c2:'#FDF0F4'},
  {id:'green', name:'青草', accent:'#5CA98C', soft:'#E9F6F0', page:'#F3FBF7', c1:'#B7DFCC', c2:'#EDF8F2'},
  {id:'sand',  name:'暖沙', accent:'#C09A63', soft:'#FAF1E4', page:'#FCF8F1', c1:'#EBD5B0', c2:'#FBF3E7'},
  {id:'violet',name:'薄暮', accent:'#8B8CC9', soft:'#EEEEFA', page:'#F6F6FD', c1:'#C9C9EC', c2:'#F0F0FB'}
];
const MOODS=['平静','愉快','疲惫','低落','期待','充实'];
const WKC=['日','一','二','三','四','五','六'];

let S={profile:{name:'我的日记',handle:'@mydiary',bio:'“把日子过成句子，慢慢写，慢慢看。”',avatar:'',cover:'',visibility:'private'},theme:'blue',entries:[]};
let editVis='private';
let editId=null, editMood='', cmId=null, view='timeline';
let todayWx={loaded:false,desc:'',temp:null}, editImgs=[];
let calY=new Date().getFullYear(), calM=new Date().getMonth()+1;
let query='';

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function uid(){return 'i'+Date.now()+Math.floor(Math.random()*900+100)}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      S={...S,...d,profile:{...S.profile,...(d.profile||{})}};
      if(!Array.isArray(S.entries)) S.entries=[];
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast('存储满了，先导出备份或删掉一些带大图的日记'); }
}
function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1700);
}
function esc(s){
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function tick(t){ return new Date(t).toLocaleTimeString('zh-CN',{hour12:false}).slice(0,5); }

/* ================= 图标 ================= */
function wxIcon(desc){
  const b='width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  if(desc && /雨/.test(desc)) return `<svg viewBox="0 0 24 24" ${b}><path d="M7 13.5h9.5a3.3 3.3 0 0 0 .3-6.6A5 5 0 0 0 7.3 7.4A3.1 3.1 0 0 0 7 13.5z"/><path d="M9 17l-.7 2.4M13 17l-.7 2.4M17 17l-.7 2.4"/></svg>`;
  if(desc && /雪/.test(desc)) return `<svg viewBox="0 0 24 24" ${b}><path d="M7 13h9.5a3.3 3.3 0 0 0 .3-6.4A5 5 0 0 0 7.3 7A3.1 3.1 0 0 0 7 13z"/><path d="M9.5 17v2M8.6 18h1.8M15 17v2M14.1 18h1.8"/></svg>`;
  if(desc && /晴间多云|多云/.test(desc)) return `<svg viewBox="0 0 24 24" ${b}><circle cx="8.5" cy="8" r="3"/><path d="M8.5 2.8v1.3M3.3 8H4.6M4.6 4.6l.9.9M12.4 4.6l-.9.9"/><path d="M9.6 19h8.2a3.1 3.1 0 0 0 .2-6.2A5 5 0 0 0 9 13.6A3 3 0 0 0 9.6 19z"/></svg>`;
  if(desc && /晴/.test(desc)) return `<svg viewBox="0 0 24 24" ${b}><circle cx="12" cy="12" r="4"/><path d="M12 3.6v1.8M12 18.6v1.8M3.6 12h1.8M18.6 12h1.8M6 6l1.3 1.3M16.7 16.7L18 18M18 6l-1.3 1.3M7.3 16.7L6 18"/></svg>`;
  if(desc && /雾|霾/.test(desc)) return `<svg viewBox="0 0 24 24" ${b}><path d="M7 11h9.5a3.3 3.3 0 0 0 .3-6.4A5 5 0 0 0 7.3 5A3.1 3.1 0 0 0 7 11z"/><path d="M4 15h16M6 18.5h12"/></svg>`;
  return `<svg viewBox="0 0 24 24" ${b}><path d="M7 17h9.5a3.5 3.5 0 0 0 .3-6.98A5.2 5.2 0 0 0 7.3 10.6A3.3 3.3 0 0 0 7 17z"/></svg>`;
}
const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-9.4A4.3 4.3 0 0 1 12 8.2a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>';
const BUBBLE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 3.2V15.5H6.5a2 2 0 0 1-2-2z"/></svg>';
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6-5.6 6-10.2A6 6 0 0 0 6 10.8C6 15.4 12 21 12 21z"/><circle cx="12" cy="10.6" r="2.2"/></svg>';

/* ================= 主题 ================= */
function applyTheme(){
  const t=THEMES.find(x=>x.id===S.theme)||THEMES[0];
  const r=document.documentElement.style;
  r.setProperty('--accent',t.accent);
  r.setProperty('--soft',t.soft);
  r.setProperty('--page',t.page);
  r.setProperty('--c1',t.c1);
  r.setProperty('--c2',t.c2);
  document.body.style.background=t.page;
  $('#themeName').textContent=t.name;
}
function renderThemeSwatches(){
  const box=$('#themes'); box.innerHTML='';
  THEMES.forEach(t=>{
    const b=document.createElement('div');
    b.className='swatch';
    b.style.borderColor=S.theme===t.id? t.accent:'transparent';
    b.innerHTML=`<span style="background:linear-gradient(150deg,${t.c1},${t.c2})"></span>`;
    b.onclick=()=>{ S.theme=t.id; save(); applyTheme(); renderThemeSwatches(); renderAll(); };
    box.appendChild(b);
  });
}

/* ================= 视图切换 ================= */
function setView(v){
  view=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  $('#view-'+v).classList.add('on');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  $('#navTitle').textContent = v==='timeline'?'时间线':(v==='calendar'?'日历':'我的');
  window.scrollTo({top:0});
  if(v==='calendar') renderCalendar();
  if(v==='timeline') renderTimeline();
  if(v==='profile') renderProfile();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#btnSwap').onclick=()=>setView(view==='calendar'?'timeline':'calendar');
$('#rowDiary').onclick=()=>setView('timeline');
$('#rowCal').onclick=()=>setView('calendar');

/* ================= 资料 ================= */
function renderProfile(){
  const p=S.profile;
  $('#pName').textContent=p.name||'我的日记';
  $('#pHandle').textContent=p.handle||'@mydiary';
  $('#pBio').textContent=p.bio||'';
  $('#pBio').style.display=p.bio?'block':'none';
  const av=$('#avatar');
  if(p.avatar){ av.style.backgroundImage=`url(${p.avatar})`; av.textContent=''; }
  else{ av.style.backgroundImage=''; av.textContent=(p.name||'我').trim().charAt(0); }
  $('#cover').style.backgroundImage = p.cover? `url(${p.cover})` : '';
  $('#fName').value=p.name||'';
  $('#fHandle').value=p.handle||'';
  $('#fBio').value=p.bio||'';
}
function renderVisChips(){
  document.querySelectorAll('#wVis .chip').forEach(b=>{
    b.classList.toggle('on', b.dataset.vis===editVis);
  });
}
document.querySelectorAll('#wVis .chip').forEach(b=>{
  b.onclick=()=>{ editVis=b.dataset.vis; renderVisChips(); };
});

/* ================= 时间线 ================= */
function sortedEntries(){
  return [...S.entries].sort((a,b)=> a.date>b.date? -1 : a.date<b.date? 1 : b.createdAt-a.createdAt);
}
function matchQuery(en){
  if(!query) return true;
  const q=query.trim().toLowerCase();
  const month=Number(en.date.slice(5,7));
  return (en.body||'').toLowerCase().includes(q) || en.date.includes(q) || String(month)===q || (q+'月')===(month+'月');
}
function entryCard(en){
  const d=new Date(en.date+'T00:00:00');
  const day=d.getDate(), wk='周'+WKC[d.getDay()];
  const imgs=en.imgs||[];
  const cls = imgs.length===1?'one':(imgs.length===2?'two':'many');
  const wx = en.wx&&en.wx.desc ? `${esc(en.wx.desc)}${en.wx.temp?(' · '+en.wx.temp+'℃'):''}` : '';
  let starHtml='';
  for(let i=1;i<=5;i++) starHtml+=`<b class="${i<=(en.stars||0)?'on':''}" data-star="${i}">★</b>`;
  return `
    <div class="tl-card" data-id="${en.id}">
      <div class="tl-head-row">
        <div>
          <div class="tl-date-line"><span class="tl-day">${day}</span><span class="tl-wk">${wk}</span></div>
          <div class="tl-time">${en.date.replace(/-/g,'/').slice(0,7)} · ${tick(en.createdAt)}</div>
        </div>
        <div class="tl-right">
          <div class="tl-author">
            <div class="tl-name">${esc(S.profile.name||'我')}</div>
            <div class="tl-vis">${en.vis==='public'?'公开':'仅自己可见'}</div>
          </div>
          ${S.profile.avatar?`<div class="tl-av" style="background-image:url(${S.profile.avatar})"></div>`:`<div class="tl-av">${esc((S.profile.name||'我').charAt(0))}</div>`}
        </div>
      </div>
      <p class="tl-body">${esc(en.body)}</p>
      ${imgs.length?`<div class="tl-imgs ${cls}">${imgs.map(u=>`<div class="tl-img" style="background-image:url(${u})"></div>`).join('')}</div>`:''}
      <div class="tl-meta">
        <div class="loc">${en.loc?PIN+esc(en.loc):''}</div>
        <div>${wx?wxIcon(en.wx.desc)+' '+wx:''}</div>
      </div>
      <div class="stars" data-id="${en.id}">${starHtml}</div>
      <div class="tl-foot">
        <div class="tl-acts">
          <button class="ibtn2 like ${en.liked?'liked':''}" data-like="${en.id}">${HEART}<span>${en.likes||0}</span></button>
          <button class="ibtn2" data-cm="${en.id}">${BUBBLE}<span>${(en.comments||[]).length}</span></button>
        </div>
        <div class="mini-acts">
          <button class="mini" data-edit="${en.id}">编辑</button>
          <button class="mini" data-del="${en.id}">删除</button>
        </div>
      </div>
    </div>`;
}
function bindCard(box){
  box.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{
    const en=S.entries.find(x=>x.id===b.dataset.like); if(!en)return;
    en.liked=!en.liked; en.likes=Math.max(0,(en.likes||0)+(en.liked?1:-1));
    b.classList.toggle('liked',en.liked); b.querySelector('span').textContent=en.likes;
    save(); renderStats();
  });
  box.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>openComments(b.dataset.cm));
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openWrite(b.dataset.edit));
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteEntry(b.dataset.del));
  box.querySelectorAll('.stars').forEach(row=>{
    const en=S.entries.find(x=>x.id===row.dataset.id); if(!en)return;
    row.querySelectorAll('[data-star]').forEach(st=>{
      st.onclick=()=>{
        const v=Number(st.dataset.star);
        en.stars = en.stars===v? 0 : v;
        save();
        row.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on', Number(x.dataset.star)<=(en.stars||0)));
      };
    });
  });
}
function renderTimeline(){
  const box=$('#timeline');
  const list=sortedEntries().filter(matchQuery);
  const chars=S.entries.reduce((n,e)=>n+(e.body||'').replace(/\s/g,'').length,0);
  $('#tlCount').textContent=`${S.entries.length} 篇 · ${chars} 字`;
  box.innerHTML='';
  if(!list.length){
    $('#tlEmpty').style.display = query? 'none':'block';
    if(query) box.innerHTML='<div style="text-align:center;color:#AFBAC7;font-size:12.5px;padding:40px 0">没有匹配的日记</div>';
    return;
  }
  $('#tlEmpty').style.display='none';
  list.forEach(en=>{
    const tpl=document.createElement('div');
    tpl.innerHTML=entryCard(en).trim();
    box.appendChild(tpl.firstElementChild);
  });
  bindCard(box);
  renderStats();
}
function renderStats(){
  const likes=S.entries.reduce((n,e)=>n+(e.likes||0),0);
  const cm=S.entries.reduce((n,e)=>n+((e.comments||[]).length),0);
  $('#sDiary').textContent=S.entries.length;
  $('#sComment').textContent=cm;
  $('#sLike').textContent=likes;
}

/* ================= 日历 ================= */
function lunarDay(y,m,d){
  try{
    if(typeof Solar==='undefined') return '';
    return Solar.fromYmd(y,m,d).getLunar().getDayInChinese();
  }catch(e){ return ''; }
}
function entriesOfDate(ds){ return S.entries.filter(e=>e.date===ds); }
function renderCalendar(){
  $('#calTitle').textContent=`${calY}年${calM}月`;
  const grid=$('#calGrid'); grid.innerHTML='';
  const first=new Date(calY, calM-1, 1);
  const startIdx=(first.getDay()+6)%7;
  const days=new Date(calY, calM, 0).getDate();
  const today=new Date();
  const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  for(let i=0;i<startIdx;i++){
    const c=document.createElement('div'); c.className='cal-cell empty'; grid.appendChild(c);
  }
  let mn=0, mp=0;
  for(let d=1; d<=days; d++){
    const ds=`${calY}-${pad(calM)}-${pad(d)}`;
    const list=entriesOfDate(ds);
    if(list.length){ mn++; mp+=list.length; }
    const cell=document.createElement('div');
    cell.className='cal-cell'+(list.length?' has':'')+(ds===todayStr?' today':'');
    const firstImg=list.find(e=>(e.imgs||[]).length)?.imgs?.[0] || '';
    cell.innerHTML=`<div class="cal-num">${d}</div>
      <div class="cal-lunar">${lunarDay(calY,calM,d)}</div>
      ${firstImg?`<div class="cal-thumb" style="background-image:url(${firstImg})"></div>`:(list.length?'<div class="cal-dot"></div>':'')}`;
    cell.onclick=()=>{
      if(list.length) openWrite([...list].sort((a,b)=>b.createdAt-a.createdAt)[0].id);
      else openWrite(null, ds);
    };
    grid.appendChild(cell);
  }
  const tail=(7-((startIdx+days)%7))%7;
  for(let i=0;i<tail;i++){
    const c=document.createElement('div'); c.className='cal-cell empty'; grid.appendChild(c);
  }
  const monthEntries=S.entries.filter(e=>e.date.startsWith(`${calY}-${pad(calM)}`));
  const chars=monthEntries.reduce((n,e)=>n+(e.body||'').replace(/\s/g,'').length,0);
  $('#calSum').innerHTML=`<span><b>${mn}</b> 天</span><i>|</i><span><b>${mp}</b> 篇</span><i>|</i><span><b>${chars}</b> 字</span>`;

  const list=$('#calDayList'); list.innerHTML='';
  if(!monthEntries.length){
    list.innerHTML='<div style="text-align:center;color:#B2BCC8;font-size:12.5px;padding:26px 0">这个月还没有记录</div>';
  }else{
    const wrap=document.createElement('div');
    wrap.innerHTML=monthEntries.sort((a,b)=>b.createdAt-a.createdAt).map(e=>entryCard(e)).join('');
    [...wrap.children].forEach(ch=>list.appendChild(ch));
    bindCard(list);
  }
}
$('#calPrev').onclick=()=>{ calM--; if(calM<1){calM=12; calY--;} renderCalendar(); };
$('#calNext').onclick=()=>{ calM++; if(calM>12){calM=1; calY++;} renderCalendar(); };
$('#calToday').onclick=()=>{ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth()+1; renderCalendar(); };

/* ================= 写日记 ================= */
function refreshMoods(){
  const box=$('#wMoods'); box.innerHTML='';
  MOODS.forEach(m=>{
    const b=document.createElement('button');
    b.className='chip'+(m===editMood?' on':'');
    b.type='button'; b.textContent=m;
    b.onclick=()=>{ editMood=(editMood===m?'':m); refreshMoods(); };
    box.appendChild(b);
  });
}
function openWrite(id, presetDate){
  editId=id||null;
  const now=new Date();
  if(id){
    const en=S.entries.find(x=>x.id===id);
    if(!en) return;
    $('#wTitle').textContent='修改日记';
    $('#wDate').value=en.date;
    $('#wWx').value=en.wx&&en.wx.desc?`${en.wx.desc}${en.wx.temp?(' '+en.wx.temp):''}`:'';
    $('#wLoc').value=en.loc||'';
    $('#wBody').value=en.body||'';
    editMood=en.mood||'';
    editImgs=(en.imgs||[]).slice();
    renderThumbs();
    editVis=en.vis||'private';
    renderVisChips();
    $('#wDelete').style.display='block';
  }else{
    $('#wTitle').textContent='写日记';
    $('#wDate').value=presetDate||`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    $('#wBody').value='';
    $('#wLoc').value='';
    editMood='';
    editImgs=[];
    renderThumbs();
    editVis=S.profile.visibility||'private';
    renderVisChips();
    $('#wDelete').style.display='none';
    $('#wWx').value=todayWx.desc?`${todayWx.desc}${todayWx.temp!==null?(' '+todayWx.temp+'°'):''}`:'';
    if(!todayWx.loaded) loadWeather();
  }
  refreshMoods();
  toggle('#sheetWrite',true);
  setTimeout(()=>$('#wBody').focus(),280);
}
$('#wSave').onclick=()=>{
  const date=$('#wDate').value;
  const body=$('#wBody').value.trim();
  if(!date){ toast('请选择日期'); return; }
  if(!body){ toast('写点什么再保存吧'); $('#wBody').focus(); return; }
  const raw=$('#wWx').value.trim();
  let desc='',temp=null;
  if(raw){
    const m=raw.match(/(-?\d+)\s*°?/);
    if(m) temp=m[1];
    desc=raw.replace(/(-?\d+\s*°?)/g,'').trim();
  }
  const loc=$('#wLoc').value.trim();
  if(editId){
    const en=S.entries.find(x=>x.id===editId);
    if(en){ en.date=date; en.body=body; en.mood=editMood; en.wx={desc,temp}; en.loc=loc; en.imgs=editImgs.slice(); en.vis=editVis; }
    toast('已更新');
  }else{
    S.entries.push({id:uid(),date,body,mood:editMood,wx:{desc,temp},loc,imgs:editImgs.slice(),vis:editVis,createdAt:Date.now(),likes:0,liked:false,stars:0,comments:[]});
    toast('已保存');
  }
  S.profile.visibility=editVis;
  save(); toggle('#sheetWrite',false);
  calY=Number(date.slice(0,4)); calM=Number(date.slice(5,7));
  renderAll();
};
$('#wDelete').onclick=()=>{ if(editId) deleteEntry(editId,true); };
function deleteEntry(id, closeAfter){
  if(!confirm('删除这一则日记？删除后无法恢复。')) return;
  S.entries=S.entries.filter(x=>x.id!==id);
  save(); if(closeAfter) toggle('#sheetWrite',false);
  renderAll(); toast('已删除');
}

/* ================= 评论 ================= */
function openComments(id){
  const en=S.entries.find(x=>x.id===id);
  if(!en) return;
  cmId=id;
  $('#cmQuote').textContent=en.body.length>70? en.body.slice(0,70)+'…' : en.body;
  renderComments();
  $('#cmInput').value='';
  toggle('#sheetComment',true);
  setTimeout(()=>$('#cmInput').focus(),260);
}
function renderComments(){
  const en=S.entries.find(x=>x.id===cmId);
  if(!en) return;
  const list=$('#cmList'); const items=en.comments||[];
  $('#cmCount').textContent=`${items.length}`;
  list.innerHTML='';
  if(!items.length){
    list.innerHTML='<div class="cm-empty">还没有评论，做第一个吧</div>';
    return;
  }
  items.forEach((c,idx)=>{
    const row=document.createElement('div');
    row.className='cm-item';
    row.innerHTML=`
      <div class="cm-av">${esc((S.profile.name||'我').charAt(0))}</div>
      <div class="cm-main">
        <div class="cm-meta">${esc(c.by)} · ${rel(c.at)} · <span data-del-cm="${idx}" style="color:#C9D3DE;cursor:pointer">删除</span></div>
        <div class="cm-text">${esc(c.text)}</div>
      </div>`;
    row.querySelector('[data-del-cm]').onclick=()=>{ items.splice(idx,1); save(); renderComments(); renderAll(); };
    list.appendChild(row);
  });
}
$('#cmSend').onclick=()=>{
  const en=S.entries.find(x=>x.id===cmId);
  if(!en) return;
  const v=$('#cmInput').value.trim();
  if(!v){ toast('写点内容再发送'); return; }
  en.comments=en.comments||[];
  en.comments.push({id:uid(),text:v,by:S.profile.name||'我',at:Date.now()});
  save(); $('#cmInput').value=''; renderComments(); renderAll(); toast('已发送');
};
$('#cmInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#cmSend').click(); });

/* ================= 时间格式 ================= */
function rel(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return '刚刚';
  if(s<3600) return Math.floor(s/60)+' 分钟前';
  if(s<86400) return Math.floor(s/3600)+' 小时前';
  if(s<86400*7) return Math.floor(s/86400)+' 天前';
  return new Date(t).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
}

/* ================= 浮层 ================= */
let openedSheet=null;
function toggle(sel,on){
  const sheet = typeof sel==='string' ? $(sel) : sel;
  if(!sheet) return;
  if(on){
    if(openedSheet && openedSheet!==sheet) openedSheet.classList.remove('on');
    openedSheet=sheet;
    sheet.classList.add('on');
    $('#scrim').classList.add('on');
    document.body.style.overflow='hidden';
  }else{
    sheet.classList.remove('on');
    $('#scrim').classList.remove('on');
    document.body.style.overflow='';
    if(openedSheet===sheet) openedSheet=null;
  }
}
$('#scrim').onclick=()=>{ if(openedSheet) toggle(openedSheet,false); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ if(openedSheet) toggle(openedSheet,false); });

/* ================= 资料保存 ================= */
$('#btnEditProfile').onclick=()=>{ renderProfile(); toggle('#sheetProfile',true); };
$('#pSave').onclick=()=>{
  S.profile.name=$('#fName').value.trim()||'我的日记';
  S.profile.handle=$('#fHandle').value.trim()||'@mydiary';
  S.profile.bio=$('#fBio').value.trim();
  S.profile.visibility=editVis;
  save(); renderProfile(); renderAll(); toggle('#sheetProfile',false); toast('资料已保存');
};
$('#btnTheme').onclick=()=>{ renderThemeSwatches(); toggle('#sheetTheme',true); };

/* ================= 图片 ================= */
function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
async function shrinkImg(file){
  const img=await readImage(file);
  const maxW=1000, sc=Math.min(1,maxW/img.width);
  const cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',0.72);
}
function renderThumbs(){
  const box=$('#wThumbs');
  if(!box) return;
  box.innerHTML='';
  editImgs.forEach((u,i)=>{
    const d=document.createElement('div');
    d.className='thumb'; d.style.backgroundImage=`url(${u})`;
    const b=document.createElement('button');
    b.type='button'; b.className='rm'; b.textContent='×';
    b.onclick=()=>{ editImgs.splice(i,1); renderThumbs(); };
    d.appendChild(b); box.appendChild(d);
  });
  const add=$('#wAddImg');
  add.style.opacity=editImgs.length>=4?'.45':'1';
  add.style.pointerEvents=editImgs.length>=4?'none':'auto';
}
const imgPicker=document.createElement('input');
imgPicker.type='file'; imgPicker.accept='image/*'; imgPicker.multiple=true;
document.body.appendChild(imgPicker);
$('#wAddImg').onclick=()=>{ if(editImgs.length<4) imgPicker.click(); };
imgPicker.onchange=async()=>{
  const files=[...imgPicker.files].slice(0, 4-editImgs.length);
  for(const f of files){
    try{ editImgs.push(await shrinkImg(f)); }catch(e){ toast('这张图读不了'); }
  }
  imgPicker.value=''; renderThumbs();
};

const picker=document.createElement('input');
picker.type='file'; picker.accept='image/*';
document.body.appendChild(picker);
let pickTarget=null;
picker.onchange=async()=>{
  const f=picker.files[0]; if(!f) return;
  try{
    const img=await readImage(f);
    if(pickTarget==='avatar'){
      const size=280, s=Math.min(img.width,img.height);
      const cv=document.createElement('canvas'); cv.width=cv.height=size;
      cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      S.profile.avatar=cv.toDataURL('image/jpeg',0.86);
    }else{
      const maxW=900, sc=Math.min(1,maxW/img.width);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      S.profile.cover=cv.toDataURL('image/jpeg',0.82);
    }
    save(); renderProfile(); renderAll();
    toast(pickTarget==='avatar'?'头像已更新':'封面已更新');
  }catch(e){ toast('图片读取失败'); }
  picker.value='';
};
$('#avatar').onclick=()=>{ pickTarget='avatar'; picker.click(); };
$('#btnAvatar').onclick=()=>{ pickTarget='avatar'; picker.click(); };
$('#btnCover').onclick=()=>{ pickTarget='cover'; picker.click(); };

/* ================= 天气 ================= */
async function loadWeather(){
  try{
    const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent('广州')+'&count=1&language=zh&format=json').then(r=>r.json());
    if(!geo.results||!geo.results.length) throw 0;
    const g=geo.results[0];
    const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,weather_code&timezone=auto`).then(r=>r.json());
    if(w&&w.current){
      todayWx={loaded:true,desc:codeDesc(w.current.weather_code),temp:Math.round(w.current.temperature_2m)};
    }
  }catch(e){ todayWx={loaded:true,desc:'',temp:null}; }
}
function codeDesc(c){
  if(c===0) return '晴';
  if(c===1) return '晴间多云';
  if(c===2) return '多云';
  if(c===3) return '阴';
  if(c===45||c===48) return '雾';
  if(c>=51&&c<=57) return '毛毛雨';
  if(c===61||c===63) return '小雨';
  if(c===65) return '大雨';
  if(c>=71&&c<=77) return '雪';
  if(c>=80&&c<=82) return '阵雨';
  if(c>=85&&c<=86) return '阵雪';
  if(c>=95) return '雷阵雨';
  return '多云';
}

$('#btnSearch').onclick=()=>{
  const bar=$('#searchBar');
  bar.classList.toggle('on');

/* ================= 导出 ================= */
function doExport(){
  if(!S.entries.length){ toast('还没有可导出的日记'); return; }
  const data={exportedAt:new Date().toISOString(),profile:S.profile,theme:S.theme,entries:S.entries};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`日记备份-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('已导出');
}
$('#btnExport2').onclick=doExport;
$('#rowExport').onclick=doExport;

load();
applyTheme();
renderProfile();
renderTimeline();
renderCalendar();
renderStats();

loadWeather();
